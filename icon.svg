<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>
    <linearGradient id="iconG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6dfa"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c040"/>
      <stop offset="100%" stop-color="#7c6dfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Icon container -->
  <rect x="106" y="106" width="300" height="300" rx="60" fill="url(#iconG)" filter="url(#glow)"/>
  
  <!-- Clapperboard symbol -->
  <!-- Base board -->
  <rect x="146" y="246" width="220" height="130" rx="16" fill="#0d0d18"/>
  <!-- Top bar -->
  <g transform="translate(146, 176)">
    <path d="M 0 0 L 220 0 L 220 50 L 0 50 Z" fill="#181828" rx="8"/>
    <polygon points="20,0 50,0 30,50 0,50" fill="#ffffff" opacity="0.9"/>
    <polygon points="80,0 110,0 90,50 60,50" fill="#ffffff" opacity="0.9"/>
    <polygon points="140,0 170,0 150,50 120,50" fill="#ffffff" opacity="0.9"/>
    <polygon points="200,0 220,0 210,50 180,50" fill="#ffffff" opacity="0.9"/>
  </g>
  <line x1="146" y1="231" x2="366" y2="231" stroke="url(#accentG)" stroke-width="6"/>

  <!-- Star / rating badge overlay -->
  <circle cx="366" cy="146" r="32" fill="#00c040"/>
  <text x="366" y="156" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">9+</text>
</svg>